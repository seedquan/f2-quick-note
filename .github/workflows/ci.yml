name: Privacy and security

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 22 for the privacy gate
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check privacy boundaries
        run: node scripts/privacy-check.mjs
      - name: Build and test
        run: swift test
      - name: Build and inspect the release executable
        run: |
          swift build -c release
          node scripts/release-privacy-check.mjs .build/release/F2QuickNote
